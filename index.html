<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Shooting Gallery</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex;
            align-items: center; justify-content: center; z-index: 100;
        }
        #startButton {
            padding: 20px 40px; font-size: 24px; cursor: pointer;
            background: #27ae60; color: white; border: none; border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="overlay">
    <button id="startButton">START VR (КАЛИБРОВКА)</button>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let isRunning = false;
    let baseBeta = 0; // Переменная для калибровки
    let calibrated = false;

    // Ресурсы
    const ASSETS = {
        bg: new Image(),
        aim: new Image()
    };
    ASSETS.bg.src = "Iceland.jpg"; // Проверь регистр! Должно совпадать с GitHub
    ASSETS.aim.src = "aim.png"; // Файл прицела (если есть)

    // Данные гироскопа
    let gyro = { x: 0, y: 0 };
    // Чувствительность (можно менять)
    const sensitivity = 15; 

    // Функция изменения размера canvas
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- ФУНКЦИЯ КАЛИБРОВКИ И СТАРТА VR ---
    async function startVR() {
        // 1. Запрос разрешения на доступ к датчикам (для iOS и современных Android)
        if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
            try {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response !== 'granted') {
                    alert("Для игры нужен доступ к гироскопу!");
                    return;
                }
            } catch (error) { console.error(error); }
        }

        // 2. Скрываем заставку и запускаем игру
        document.getElementById("overlay").style.display = "none";
        isRunning = true;
        calibrated = false; // Сбрасываем калибровку для нового старта

        // 3. Обработка поворота телефона
        window.addEventListener('deviceorientation', (event) => {
            if (!isRunning) return;

            // КАЛИБРОВКА (Первое срабатывание датчика): Запоминаем текущий наклон как центр
            if (!calibrated) {
                baseBeta = event.beta; // Запоминаем, как пользователь держит телефон в руках
                calibrated = true;
                console.log("Калибровка завершена. Центр на beta:", baseBeta);
                return;
            }

            let x, y;

            // Вычисляем отклонение от начального положения (базы)
            let offsetBeta = event.beta - baseBeta;
            let offsetGamma = event.gamma;

            // Проверяем ориентацию (горизонтально/вертикально)
            if (window.innerWidth > window.innerHeight) {
                // ЛАНДШАФТ (на боку)
                // Теперь наклон вперед-назад (beta) управляет движением влево-вправо
                x = offsetBeta * sensitivity;
                // А наклон влево-вправо (gamma) управляет движением вверх-вниз
                y = -offsetGamma * sensitivity; 
            } else {
                // ПОРТРЕТ (вертикально)
                x = offsetGamma * sensitivity;
                y = offsetBeta * sensitivity;
            }

            // Применяем к переменным gyro
            gyro.x = x;
            gyro.y = y;

        }, true);

        animate();
    }

    // --- ОСНОВНОЙ ЦИКЛ РИСОВАНИЯ (ANIMATE) ---
    function animate() {
        if (!isRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // --- ИСПРАВЛЕНИЕ: МЕНЬШИЙ МАСШТАБ КАРТИНКИ ---
        // Задаем масштаб фона (например, 80% от размера экрана)
        // Чтобы картинка была меньше, уменьши это число (например, 0.5)
        const scaleFactor = 0.8; 
        
        // Вычисляем размеры фона
        const bgWidth = canvas.width * scaleFactor;
        const bgHeight = (canvas.width / canvas.height) * bgWidth; // Сохраняем пропорции

        // Вычисляем центр экрана
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // Рисуем фон, смещая его на значения гироскопа
        // Применяем `-gyro.x` и `-gyro.y` для эффекта VR (камера движется против телефона)
        const drawX = (centerX - bgWidth / 2) - gyro.x;
        const drawY = (centerY - bgHeight / 2) - gyro.y;

        // Рисуем уменьшенный фон
        if (ASSETS.bg.complete) {
            ctx.drawImage(ASSETS.bg, drawX, drawY, bgWidth, bgHeight);
        } else {
            // Если картинка не загрузилась, рисуем серый фон для теста
            ctx.fillStyle = "#333";
            ctx.fillRect(drawX, drawY, bgWidth, bgHeight);
        }

        // Рисуем прицел в центре экрана (не движется)
        const aimSize = 30;
        if (ASSETS.aim.complete) {
            ctx.drawImage(ASSETS.aim, centerX - aimSize/2, centerY - aimSize/2, aimSize, aimSize);
        } else {
            // Запасной красный прицел, если aim.png нет
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        // Рисуем текст (AMMO, SCORE)
        ctx.fillStyle = "yellow";
        ctx.font = "20px Arial";
        ctx.fillText("AMMO: ∞", 20, 30); // Заглушка, замени на свои переменные ammo
        ctx.fillText("SCORE: 0", 20, 60); // Заглушка, замени на свои переменные score

        requestAnimationFrame(animate);
    }

    // Запуск по кнопке
    document.getElementById("startButton").addEventListener("click", startVR);

</script>
</body>
</html>
