<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Shooting Gallery</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        #startButton {
            padding: 20px 50px; font-size: 28px; cursor: pointer;
            background: #27ae60; color: white; border: none; border-radius: 15px;
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4); transition: 0.3s;
        }
        #startButton:active { transform: scale(0.95); }
        .instructions { margin-top: 20px; color: #aaa; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>

<div id="overlay">
    <button id="startButton">START GAME</button>
    <div class="instructions">
        1. Поверните телефон горизонтально<br>
        2. Держите его перед глазами прямо<br>
        3. Нажмите кнопку для калибровки центра
    </div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Игровые переменные
    let isRunning = false;
    let ammo = 30;
    let score = 0;
    let baseBeta = null; 
    let gyro = { x: 0, y: 0 };
    const sensitivity = 18; // Скорость движения камеры

    // Ресурсы
    const ASSETS = {
        bg: new Image(),
        gunshot: new Audio("ak74_shot.mp3") // Убедись, что файл есть на GitHub
    };
    ASSETS.bg.src = "iceland.jpg"; 

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Функция стрельбы
    function fire() {
        if (!isRunning || ammo <= 0) {
            if (ammo <= 0) console.log("Recharge! (Perezaryadka!)");
            return;
        }
        ammo--;
        
        // Звук выстрела
        ASSETS.gunshot.currentTime = 0;
        ASSETS.gunshot.play().catch(() => {});

        // Простая логика попадания (если прицел близко к центру - даем очки)
        // В будущем здесь можно добавить проверку попадания в мишени
        score += 1; 
    }

    // Клик по экрану для стрельбы
    window.addEventListener('click', (e) => {
        if (isRunning && e.target.id !== 'startButton') fire();
    });

    async function startVR() {
        if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
            try {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response !== 'granted') return;
            } catch (e) { console.error(e); }
        }

        document.getElementById("overlay").style.display = "none";
        isRunning = true;
        baseBeta = null; // Сброс калибровки

        window.addEventListener('deviceorientation', (event) => {
            if (!isRunning) return;

            // Калибровка: запоминаем наклон в момент нажатия кнопки
            if (baseBeta === null) {
                baseBeta = event.beta;
            }

            let deltaBeta = event.beta - baseBeta;

            // Горизонтальный режим
            if (window.innerWidth > window.innerHeight) {
                gyro.x = deltaBeta * sensitivity;
                gyro.y = -event.gamma * sensitivity; 
            } else {
                // Вертикальный режим
                gyro.x = event.gamma * sensitivity;
                gyro.y = deltaBeta * sensitivity;
            }
        }, true);

        animate();
    }

    function animate() {
        if (!isRunning) return;

        // Фон
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // МАСШТАБ КАРТИНКИ: 0.6 (60% экрана) - можно менять
        const bgScale = 0.6; 
        const drawWidth = canvas.width * bgScale;
        const drawHeight = (ASSETS.bg.height / ASSETS.bg.width) * drawWidth;

        const centerY = (canvas.height - drawHeight) / 2;
        const halfWidth = canvas.width / 2;

        if (ASSETS.bg.complete) {
            // Рисуем для двух глаз (VR эффект)
            
            // Левый глаз
            ctx.save();
            ctx.beginPath(); ctx.rect(0, 0, halfWidth, canvas.height); ctx.clip();
            ctx.drawImage(ASSETS.bg, (halfWidth/2 - drawWidth/2) - gyro.x, centerY - gyro.y, drawWidth, drawHeight);
            ctx.restore();

            // Правый глаз
            ctx.save();
            ctx.beginPath(); ctx.rect(halfWidth, 0, halfWidth, canvas.height); ctx.clip();
            ctx.drawImage(ASSETS.bg, (halfWidth + halfWidth/2 - drawWidth/2) - gyro.x, centerY - gyro.y, drawWidth, drawHeight);
            ctx.restore();
        }

        // Интерфейс и прицелы
        const eyeCenters = [canvas.width * 0.25, canvas.width * 0.75];
        
        eyeCenters.forEach(centerX => {
            // Прицел
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(centerX, canvas.height / 2, 5, 0, Math.PI * 2);
            ctx.fill();

            // Текст (AMMO и SCORE)
            ctx.fillStyle = "yellow";
            ctx.font = "bold 20px Arial";
            ctx.fillText("AMMO: " + ammo, centerX - 100, 40);
            ctx.fillText("SCORE: " + score, centerX - 100, 70);
        });

        requestAnimationFrame(animate);
    }

    document.getElementById("startButton").addEventListener("click", startVR);
</script>

</body>
</html>
