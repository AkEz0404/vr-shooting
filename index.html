<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Pro Shooter</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
        canvas { display: block; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        #startButton {
            padding: 20px 50px; font-size: 25px; cursor: pointer;
            background: #27ae60; color: white; border: none; border-radius: 10px;
        }
        .desc { margin-top: 15px; color: #aaa; text-align: center; }
    </style>
</head>
<body>

<div id="overlay">
    <button id="startButton">START GAME</button>
    <div class="desc">Держите телефон вертикально перед глазами<br>и нажмите кнопку для калибровки</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let isRunning = false;
    let score = 0;
    let ammo = 30;
    let gyro = { x: 0, y: 0 };
    let baseBeta = null; // Точка отсчета для рук
    let lastShotTime = 0;

    // Ресурсы
    const ASSETS = {
        bg: new Image(),
        shot: new Audio("ak74_shot.mp3")
    };
    ASSETS.bg.src = "iceland.jpg"; // Если не сработает, попробуй 3_iceland.jpg

    // Мишени
    let targets = [];
    function createTargets() {
        for(let i=0; i<5; i++) {
            targets.push({
                x: (Math.random()-0.5)*500,
                y: (Math.random()-0.5)*300,
                vx: (Math.random()-0.5)*3,
                vy: (Math.random()-0.5)*3,
                size: 25,
                active: true
            });
        }
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Выстрел
    function fire() {
        const now = Date.now();
        if (!isRunning || ammo <= 0 || (now - lastShotTime) < 200) return;
        lastShotTime = now;
        ammo--;
        ASSETS.shot.currentTime = 0;
        ASSETS.shot.play().catch(()=>{});

        // Проверка попадания
        targets.forEach(t => {
            if (!t.active) return;
            let dx = t.x - gyro.x;
            let dy = t.y - gyro.y;
            if (Math.sqrt(dx*dx + dy*dy) < t.size + 10) {
                t.active = false;
                score += 10;
                setTimeout(() => { t.active = true; t.x = (Math.random()-0.5)*500; }, 2000);
            }
        });
    }

    window.addEventListener('pointerdown', (e) => {
        if (isRunning && e.target.id !== 'startButton') fire();
    });

    // Старт и Калибровка
    document.getElementById("startButton").onclick = async () => {
        if (window.DeviceOrientationEvent?.requestPermission) {
            await DeviceOrientationEvent.requestPermission();
        }
        document.getElementById("overlay").style.display = "none";
        createTargets();
        isRunning = true;

        window.addEventListener('deviceorientation', (e) => {
            // САМОЕ ВАЖНОЕ: запоминаем угол, когда нажали кнопку
            if (baseBeta === null) baseBeta = e.beta;
            
            let deltaBeta = e.beta - baseBeta; // Смещение относительно рук

            if (window.innerWidth > window.innerHeight) {
                gyro.x = deltaBeta * 15;
                gyro.y = -e.gamma * 15;
            } else {
                gyro.x = e.gamma * 15;
                gyro.y = deltaBeta * 15;
            }
        });
        animate();
    };

    function animate() {
        if (!isRunning) return;
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const scale = 0.6; // Масштаб картинки (60%)
        const dw = canvas.width * scale;
        const dh = (ASSETS.bg.height / ASSETS.bg.width) * dw || 400;
        const half = canvas.width / 2;

        [0, half].forEach(offset => {
            ctx.save();
            ctx.beginPath(); ctx.rect(offset, 0, half, canvas.height); ctx.clip();
            const cx = offset + half/2;
            const cy = canvas.height/2;

            // Фон
            if (ASSETS.bg.complete) {
                ctx.drawImage(ASSETS.bg, (cx - dw/2) - gyro.x, (cy - dh/2) - gyro.y, dw, dh);
            }

            // Мишени
            targets.forEach(t => {
                if (!t.active) return;
                if (offset === 0) { t.x += t.vx; t.y += t.vy; if(Math.abs(t.x)>300) t.vx*=-1; if(Math.abs(t.y)>200) t.vy*=-1; }
                
                ctx.fillStyle = "red";
                ctx.beginPath(); ctx.arc(cx + t.x - gyro.x, cy + t.y - gyro.y, t.size, 0, 7); ctx.fill();
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(cx + t.x - gyro.x, cy + t.y - gyro.y, 5, 0, 7); ctx.fill();
            });

            // Прицел
            ctx.strokeStyle = "lime"; ctx.lineWidth = 2;
            ctx.strokeRect(cx - 15, cy - 15, 30, 30);
            ctx.fillStyle = "lime"; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 7); ctx.fill();

            // Текст
            ctx.fillStyle = "yellow"; ctx.font = "20px Arial";
            ctx.fillText("AMMO: " + ammo, offset + 20, 40);
            ctx.fillText("SCORE: " + score, offset + 20, 70);
            ctx.restore();
        });

        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
