<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Final Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
        canvas { display: block; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        #startBtn {
            padding: 25px 60px; font-size: 28px; cursor: pointer;
            background: #e67e22; color: white; border: none; border-radius: 50px;
            text-transform: uppercase; font-weight: bold;
        }
        .msg { margin-top: 20px; color: #7f8c8d; text-align: center; font-size: 16px; }
    </style>
</head>
<body>

<div id="overlay">
    <button id="startBtn">ИГРАТЬ (START)</button>
    <div class="msg">Направьте телефон перед собой (вперед)<br>и нажмите на кнопку</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let isRunning = false;
    let score = 0;
    let ammo = 30;
    let gyro = { x: 0, y: 0 };
    let offset = { b: 0, g: 0 }; // Смещение калибровки
    let lastShot = 0;

    const bg = new Image();
    bg.src = "iceland.jpg"; // Убедись, что файл Iceland.jpg или iceland.jpg есть в GitHub!

    let targets = [];
    function initTargets() {
        targets = [];
        for(let i=0; i<6; i++) {
            targets.push({
                x: (Math.random()-0.5)*600,
                y: (Math.random()-0.5)*400,
                vx: (Math.random()-0.5)*4,
                vy: (Math.random()-0.5)*4,
                active: true
            });
        }
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function fire() {
        const now = Date.now();
        if (!isRunning || ammo <= 0 || (now - lastShot) < 250) return;
        lastShot = now;
        ammo--;
        // Звук (опционально, если есть файл)
        new Audio("ak74_shot.mp3").play().catch(()=>{});

        targets.forEach(t => {
            if (!t.active) return;
            let dx = t.x - gyro.x;
            let dy = t.y - gyro.y;
            if (Math.sqrt(dx*dx + dy*dy) < 35) {
                t.active = false;
                score += 10;
                setTimeout(() => { t.active = true; t.x = (Math.random()-0.5)*600; }, 1500);
            }
        });
    }

    window.addEventListener('pointerdown', (e) => {
        if (isRunning && e.target.id !== 'startBtn') fire();
    });

    document.getElementById("startBtn").onclick = async () => {
        if (window.DeviceOrientationEvent?.requestPermission) {
            await DeviceOrientationEvent.requestPermission();
        }
        document.getElementById("overlay").style.display = "none";
        initTargets();
        isRunning = true;

        window.addEventListener('deviceorientation', (e) => {
            if (offset.b === 0 && offset.g === 0) {
                offset.b = e.beta;
                offset.g = e.gamma;
            }
            
            // Расчет с учетом калибровки
            let b = e.beta - offset.b;
            let g = e.gamma - offset.g;

            // Чувствительность
            const sens = 15;

            if (window.innerWidth > window.innerHeight) {
                gyro.x = b * sens;
                gyro.y = -g * sens;
            } else {
                gyro.x = g * sens;
                gyro.y = b * sens;
            }
        });
        animate();
    };

    function animate() {
        if (!isRunning) return;
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const scale = 0.8; // Размер картинки
        const dw = canvas.width * scale;
        const dh = (bg.height / bg.width) * dw || 500;
        const half = canvas.width / 2;

        [0, half].forEach(viewOffset => {
            ctx.save();
            ctx.beginPath(); ctx.rect(viewOffset, 0, half, canvas.height); ctx.clip();
            
            const cx = viewOffset + half / 2;
            const cy = canvas.height / 2;

            // 1. Фон
            if (bg.complete) {
                ctx.drawImage(bg, (cx - dw/2) - gyro.x, (cy - dh/2) - gyro.y, dw, dh);
            } else {
                ctx.strokeStyle = "red";
                ctx.strokeRect((cx - dw/2) - gyro.x, (cy - dh/2) - gyro.y, dw, dh);
            }

            // 2. Мишени
            targets.forEach(t => {
                if (!t.active) return;
                if (viewOffset === 0) { // Физика только 1 раз
                    t.x += t.vx; t.y += t.vy;
                    if (Math.abs(t.x) > 300) t.vx *= -1;
                    if (Math.abs(t.y) > 250) t.vy *= -1;
                }
                ctx.fillStyle = "red";
                ctx.beginPath(); ctx.arc(cx + t.x - gyro.x, cy + t.y - gyro.y, 25, 0, 7); ctx.fill();
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(cx + t.x - gyro.x, cy + t.y - gyro.y, 8, 0, 7); ctx.fill();
            });

            // 3. Прицел (зафиксирован в центре глаза)
            ctx.strokeStyle = "#0f0"; ctx.lineWidth = 3;
            ctx.strokeRect(cx - 20, cy - 20, 40, 40);
            ctx.fillStyle = "#0f0"; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 7); ctx.fill();

            // 4. Текст
            ctx.fillStyle = "#fff"; ctx.font = "bold 22px Arial";
            ctx.fillText("AMMO: " + ammo, viewOffset + 30, 50);
            ctx.fillText("SCORE: " + score, viewOffset + 30, 85);
            ctx.restore();
        });

        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
