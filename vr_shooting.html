<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
	<title>VR Shooting Simulator</title>
	<style>
	body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
	canvas { display: block; width: 100vw; height: 100vh; }
	#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; 
justify-content: center; align-items: center;  background: rgba(0,0,0,0.8); color: white; z-index: 10; }
	button {
padding: 20px 40px; font-size: 24px; cursor: pointer; background: #4CAF50; color: white; border: none; 
border-radius: 5px; }
	</style>
  </head>

  <body>
    <div id="overlay">
	<button onclick="startVR()">START VR TRAINING (BAŞLA)</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
	const canvas = document.getElementById("gameCanvas");
	const ctx = canvas.getContext("2d", { willReadFrequently: true});
	
	const T10_CONFIG = { x: 960, y: 540 };
	let gyro = { x: 0, y: 0 };
	let isRunning = false;

	const ASSETS = {
	   bg: new Image(),
	   bulletMark: new Image(),
	   gunshot: new Audio("ak74_shot.mp3") };
	ASSETS.bg.src = "iceland.jpg";
	ASSETS.bulletMark.src = "bullet_mark.png";

	function resize() {
	   canvas.width = window.innerWidth;
	   canvas.height = window.innerHeight; }
	window.addEventListener('resize', resize);
	resize();

	async function startVR() {
		if (typeof DeviceOrientationEvent ! == 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
		const permission = await DeviceOrientationEvent.requestPermission();
		if (permission !== 'granted') return alert("Rugsat berilmedi!"); }

		document.getElementById("overlay").style.display = "none";
		isRunning = true;
		window.addEventListener('deviceorientation', (event) =>
	{
		gyro.x = event.gamma * 12;
		gyro.y = (event.beta - 45) * 12; }, true);
		animate(); }

	function fire() {
		if (!isRunning) return;
		ASSETS.gunshot.currentTime = 0;
		ASSETS.gunshot.play();
		gyro.y -= 4; }
	const startShooting = (e) => {
		if (!isRunning) return;
		fire();
		shootInterval = setInterval(fire, 110); };

	const stopShooting = () => {
		clearInterval(shootInterval); };

	window.addEventListener('mousedown', startShooting);
	window.addEventListener('mouseup', stopShooting);

	window.addEventListener('touchstart', startShooting);
	window.addEventListener('touchend', stopShooting);

	function drawScene(offsetX, eyeOffset) {
		const w = canvas.width / 2;
		const h = canvas.height;

		ctx.save();
		ctx.beginPath();
		ctx.rect(offsetX, 0, w, h);
		ctx.clip();

	const zoom = 1.4;
	ctx.drawImage(ASSETS.bg, offsetX - (w * zoom - w)/2 + gyro.x + eyeOffset, -(h * zoom - h)/2 + gyro.y, w * zoom, h * zoom);

	ctx.fillStyle = "red";
	ctx.beginPath();
	ctx.arc(offsetX + w/2, h/2, 4, 0, Math.PI * 2);
	ctx.fill();

	ctx.restore();
	}

	function animate() {
		if (!isRunning) return;
		ctx.clearRect(0, 0, canvas.width, canvas.height);

	drawScene(0, -8);
	drawScene(canvas.width / 2, 8);

	ctx.fillStyle = "black";
	ctx.fillRect(canvas.width / 2 - 2, 0, 4, canvas.height);

	requestAnimationFrame(animate);
	}

    </script>
  </body>
</html>
